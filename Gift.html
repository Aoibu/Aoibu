<body data-page="gift">
<a class="sr-only" href="#main">تخطَّ إلى المحتوى</a>
<header id="site-header" class="site-header"></header>
<main id="main">
<div class="container center-card"><div class="panel" style="padding:clamp(22px,4vw,40px)">
  <div style="font-size:56px;line-height:1">🎁</div>
  <h1 style="font-size:30px;margin:12px 0 6px">إهداء للفريق</h1>
  <p style="color:var(--text-2);margin-bottom:22px">وجودكم معنا هو أكبر داعم لنا 💙<br>إذا رغبت في شكر الفريق أو المساهمة، أرسل بطاقة الهدية هنا بكل حب.</p>
  <form id="giftForm" class="form-grid">
    <label>الاسم أو اللقب (اختياري)<input class="input" type="text" name="name" maxlength="60"></label>
    <label>نوع البطاقة<select class="select" name="type" required><option value="" disabled selected>اختر نوع البطاقة</option><option value="Google Play">Google Play (جوجل بلاي)</option><option value="iTunes">App Store & iTunes (آيتونز)</option><option value="Steam">Steam (ستيم)</option><option value="PlayStation">PlayStation Store</option><option value="Amazon">Amazon (أمازون)</option><option value="Other">نوع آخر</option></select></label>
    <label>كود البطاقة<input class="input" type="text" name="code" required dir="ltr" style="text-align:center;letter-spacing:2px" placeholder="XXXX-XXXX-XXXX"></label>
    <label>قيمة البطاقة (اختياري)<input class="input" type="text" name="amount" placeholder="مثلاً: 10$ أو 50 ريال"></label>
    <label>كلمة للفريق (اختياري)<textarea class="textarea" name="message" rows="2" style="min-height:70px"></textarea></label>
    <button type="submit" class="btn btn-primary" style="width:100%">💌 إرسال الإهداء</button>
    <div id="status-msg" class="status" role="status"></div>
  </form>
</div></div>
</main>
<footer id="site-footer"></footer>
<script src="assets/js/app.js?v=3"></script>
<script>
(async function(){
  const A = window.Aoibu, site = await A.siteReady;
  const form = document.getElementById("giftForm"), st = document.getElementById("status-msg");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = form.querySelector("button[type=submit]"), old = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = "⏳ جاري الإرسال…"; st.className = "status";
    try { await fetch(site.endpoints.gift, { method: "POST", body: new FormData(form) }); } catch (err) { /* ردود Google Script غالباً معتمة لكن البيانات تصل */ }
    st.className = "status ok"; st.textContent = "✅ شكراً لك! وصلت هديتك، ممتنون جداً لدعمك ولطفك 💙"; form.reset();
    btn.disabled = false; btn.innerHTML = old;
  });
})();
</script>
</body>
