name: تثبيت الموقع الجديد

on:
  push:
    paths:
      - "Aoibu-new-site.zip"
      - ".github/workflows/install-site.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: حذف الملفات القديمة وتثبيت الجديدة
        run: |
          set -e
          if [ ! -f Aoibu-new-site.zip ]; then
            echo "ملف Aoibu-new-site.zip غير موجود بعد — ارفعه وسيعمل التثبيت تلقائياً"
            exit 0
          fi
          rm -rf /tmp/new && mkdir -p /tmp/new
          unzip -q Aoibu-new-site.zip -d /tmp/new
          SRC=/tmp/new
          [ -d /tmp/new/Aoibu-main ] && SRC=/tmp/new/Aoibu-main
          test -f "$SRC/index.html"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rm -rf "$SRC/.github"
          cp -a "$SRC"/. ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "تثبيت الموقع الجديد (Aoibu)"
          git push
