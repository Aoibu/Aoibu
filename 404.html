<script>
/* تحويل الروابط القديمة (مثل 1204.html أو M28.html) تلقائياً للصفحات الجديدة */
(function(){
  var p = location.pathname, root = /^\/Aoibu\//i.test(p) ? "/Aoibu/" : "/";
  var f = decodeURIComponent(p.slice(p.lastIndexOf("/") + 1)).replace(/\.html?$/i, "");
  var dir = p.toLowerCase();
  var to = null, m;
  if (/^\d{1,4}$/.test(f)) to = "watch.html?id=" + f;
  else if (/^1202s$/i.test(f)) to = "watch.html?id=1202.5";
  else if ((m = f.match(/^(\d{1,4})s$/i))) to = "watch.html?id=" + m[1] + ".5";
  else if ((m = f.match(/^M(\d{4})$/i))) to = "read.html?id=" + m[1];
  else if ((m = f.match(/^MSPI(\d+)$/i))) to = "read.html?id=SP" + m[1];
  else if ((m = f.match(/^M(\d{1,2})(Watch|Down|Main)?$/i))) to = "watch.html?id=M" + m[1];
  else if (/^support$/i.test(f) || f === "gift") to = "Gift.html";
  else if (f === "vote") to = "Vote.html";
  else if (/^(home|index)$/i.test(f)) to = "./";
  if (to) location.replace(root + to + location.hash);
})();
