<header id="site-header" class="site-header"></header>
<main id="main">
<div class="container"><div class="page-head"><h1>📰 أخبار كونانية</h1><p>آخر أخبار أنمي ومانجا المحقق كونان أولاً بأول. فعّل الإشعارات لتصلك الأخبار فور نشرها.</p></div>
<div class="news-grid" id="news-grid" style="margin-top:24px"><div class="skeleton" style="aspect-ratio:4/4"></div><div class="skeleton" style="aspect-ratio:4/4"></div><div class="skeleton" style="aspect-ratio:4/4"></div><div class="skeleton" style="aspect-ratio:4/4"></div><div class="skeleton" style="aspect-ratio:4/4"></div><div class="skeleton" style="aspect-ratio:4/4"></div></div></div>
</main>
<footer id="site-footer"></footer>
<script src="assets/js/app.js?v=3"></script>
<script>
(async function(){
  const A = window.Aoibu, {$, esc, icon} = A;
  const site = await A.siteReady;
  const grid = $("#news-grid"), LIMIT = 160;
  const safeId = (t) => !t ? "news-unknown" : "news-" + t.trim().replace(/\s+/g, "-").replace(/[^\w؀-ۿ\-]/g, "");
  try {
    const res = await fetch(site.endpoints.news);
    const data = await res.json();
    if (!Array.isArray(data) || !data.length) { grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1">لا توجد أخبار حالياً.</div>'; return; }
    grid.innerHTML = data.map((n) => {
      const id = safeId(n.title), d = n.desc || "", long = d.length > LIMIT;
      return `<article class="news-card reveal" id="${esc(id)}">
        <div class="media"><img src="${esc(n.image || "assets/img/og-cover.jpg")}" alt="${esc(n.title)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.src='assets/img/og-cover.jpg'">${n.category ? `<span class="badge no-dot">${esc(n.category)}</span>` : ""}</div>
        <div class="body"><time>${esc(n.date || "")}</time><h2>${esc(n.title)}</h2>
          <p data-full="${esc(d)}">${esc(long ? d.slice(0, LIMIT) + "…" : d)}</p>${long ? '<button class="more" type="button">اقرأ المزيد</button>' : ""}</div>
        <div class="actions"><button class="btn btn-sm" data-share="${esc(id)}" data-title="${esc(n.title)}">${icon("share")} مشاركة</button></div></article>`;
    }).join("");
    A.reveal(grid);
    const ld = document.createElement("script"); ld.type = "application/ld+json";
    ld.textContent = JSON.stringify(data.slice(0, 10).map((n) => ({"@context":"https://schema.org","@type":"NewsArticle","headline":n.title,"image":[n.image || ""],"datePublished":n.date,"author":{"@type":"Organization","name":"Aoibu Team"}})));
    document.head.appendChild(ld);
    if (location.hash) { const el = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (el) { el.classList.add("in"); setTimeout(() => { el.scrollIntoView({behavior:"smooth", block:"center"}); el.classList.add("highlight"); setTimeout(() => el.classList.remove("highlight"), 2600); }, 300); } }
  } catch (e) { grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1">تعذّر جلب الأخبار، حاول لاحقاً.</div>'; }
  grid.addEventListener("click", (e) => {
    const m = e.target.closest(".more");
    if (m) { const p = m.previousElementSibling; const open = m.dataset.open === "1"; const full = p.dataset.full; p.textContent = open ? full.slice(0, LIMIT) + "…" : full; m.dataset.open = open ? "0" : "1"; m.textContent = open ? "اقرأ المزيد" : "عرض أقل"; }
    const s = e.target.closest("[data-share]");
    if (s) A.share(s.dataset.title, location.origin + location.pathname + "#" + encodeURIComponent(s.dataset.share));
  });
})();
</script>
