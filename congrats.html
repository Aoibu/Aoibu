<body data-page="congrats">
<a class="sr-only" href="#main">تخطَّ إلى المحتوى</a>
<header id="site-header" class="site-header"></header>
<main id="main">
<div class="container" style="max-width:820px">
  <div class="page-head" style="text-align:center"><h1>💬 تعليقاتكم للفريق</h1><p style="margin-inline:auto">شاركنا رأيك، اقتراحك، أو كلمة جميلة للفريق — كل تعليق يصلنا ويهمّنا.</p></div>
  <section class="panel"><h2 class="panel-title">اكتب تعليقك للفريق</h2>
    <form id="congratsForm" class="form-grid"><input class="input" id="userName" placeholder="اسمك الكريم" required maxlength="50"><textarea class="textarea" id="userMsg" placeholder="اكتب تعليقك هنا…" required maxlength="800"></textarea><button type="submit" id="submitBtn" class="btn btn-primary">إرسال التعليق ✨</button></form>
  </section>
  <section class="panel"><h2 class="panel-title">ماذا قال المتابعون</h2><div class="comment-list" id="commentsList"><div class="spinner" style="margin:20px auto"></div></div></section>
</div>
</main>
<footer id="site-footer"></footer>
<script src="assets/js/app.js?v=3"></script>
<script>
(async function(){
  const A = window.Aoibu, {$, esc} = A, site = await A.siteReady, URL_ = site.endpoints.congrats;
  const list = $("#commentsList");
  async function load(){
    try { const r = await fetch(URL_); const data = await r.json();
      list.innerHTML = data.length ? data.slice().reverse().map((row) => `<div class="comment"><span class="avatar">${esc(String(row[0]||"؟").trim().charAt(0))}</span><div class="comment-box"><div class="comment-head"><b>${esc(row[0])}</b><time>${row[2] ? new Date(row[2]).toLocaleDateString("ar",{year:"numeric",month:"short",day:"numeric"}) : ""}</time></div><div class="comment-body">${esc(row[1])}</div></div></div>`).join("") : '<p style="text-align:center;color:var(--text-3)">لا توجد تعليقات بعد، كن الأول! ✨</p>';
    } catch(e){ list.innerHTML = '<p style="text-align:center;color:var(--text-3)">حدث خطأ أثناء تحميل التعليقات.</p>'; }
  }
  $("#congratsForm").addEventListener("submit", async (e) => {
    e.preventDefault(); const btn = $("#submitBtn"); btn.disabled = true; btn.textContent = "جاري الإرسال…";
    try { await fetch(URL_, { method: "POST", mode: "no-cors", body: JSON.stringify({ name: $("#userName").value, message: $("#userMsg").value }) }); A.toast("تم إرسال تعليقك! سيظهر خلال ثوانٍ 💙"); e.target.reset(); setTimeout(load, 2000); }
    catch(err){ A.toast("حدث خطأ، حاول مرة أخرى"); }
    finally { btn.disabled = false; btn.textContent = "إرسال التعليق ✨"; }
  });
  load();
})();
</script>
