<body data-page="vote">
<a class="sr-only" href="#main">تخطَّ إلى المحتوى</a>
<header id="site-header" class="site-header"></header>
<main id="main">
<div class="container"><div class="page-head"><h1>📊 أفضل أفلام المحقق كونان</h1><p>انتهى التصويت — هذه هي النتائج النهائية لأفلام كونان من 1 إلى 28 بحسب أصوات الجمهور.</p></div>
<div class="grid grid-movies" id="grid" style="margin-top:24px"></div><p style="color:var(--text-3);font-size:13px;margin-top:18px">الصور عبر Wikipedia API.</p></div>
</main>
<footer id="site-footer"></footer>
<script src="assets/js/app.js?v=3"></script>
<script>
(async function(){
  const A = window.Aoibu, {$, esc} = A; await A.siteReady;
  const MOVIES = [
    [1,'العد التنازلي لناطحة السحاب','Case_Closed:_The_Time_Bombed_Skyscraper',128],[2,'الهدف الرابع عشر','Case_Closed:_The_Fourteenth_Target',114],
    [3,'ساحر القرن الأخير','Case_Closed:_The_Last_Wizard_of_the_Century',121],[4,'أسير في عينيها','Case_Closed:_Captured_in_Her_Eyes',122],
    [5,'العد التنازلي للجنة','Case_Closed:_Countdown_to_Heaven',119],[6,'خيال شارع بيكر','Case_Closed:_The_Phantom_of_Baker_Street',139],
    [7,'تقاطع طرق في العاصمة القديمة','Case_Closed:_Crossroad_in_the_Ancient_Capital',107],[8,'ساحر السماء الفضية','Case_Closed:_Magician_of_the_Silver_Sky',111],
    [9,'استراتيجية ما فوق الأعماق','Case_Closed:_Strategy_Above_the_Depths',109],[10,'لحن وداع المحققين',"Case_Closed:_The_Private_Eyes'_Requiem",113],
    [11,'علم القراصنة في عرض المحيط','Case_Closed:_Jolly_Roger_in_the_Deep_Azure',96],[12,'لحن كامل من الرعب','Case_Closed:_Full_Score_of_Fear',112],
    [13,'المطارد الأسود','Case_Closed:_The_Raven_Chaser',122],[14,'السفينة الضائعة في السماء','Case_Closed:_The_Lost_Ship_in_the_Sky',111],
    [15,'ربع ساعة من الصمت','Case_Closed:_Quarter_of_Silence',103],[16,'المهاجم الحادي عشر','Case_Closed:_The_Eleventh_Striker',109],
    [17,'عين خفية في البحر البعيد','Case_Closed:_Private_Eye_in_the_Distant_Sea',86],[18,'قناص من بُعد آخر','Case_Closed:_Dimensional_Sniper',101],
    [19,'تباعات الشمس الجهنمية','Case_Closed:_Sunflowers_of_Inferno',98],[20,'الكابوس الأشد سوادًا','Case_Closed:_The_Darkest_Nightmare',115],
    [21,'رسالة الحب القرمزية','Case_Closed:_The_Crimson_Love_Letter',107],[22,'الجلاد زيرو','Case_Closed:_Zero_the_Enforcer',106],
    [23,'القبضة اللازوردية','Case_Closed:_The_Fist_of_Blue_Sapphire',119],[24,'الرصاصة القرمزية','Case_Closed:_The_Scarlet_Bullet',104],
    [25,'عروس الهالووين','Case_Closed:_The_Bride_of_Halloween',125],[26,'الغواصة الحديدية السوداء','Case_Closed:_Black_Iron_Submarine',139],
    [27,'لافتة المليون دولار','Detective_Conan:_The_Million-dollar_Pentagram',127],[28,'فلاش باك ذو العين الواحدة','Detective_Conan:_One-Eyed_Flashback',120]
  ].map(([n,t,w,v]) => ({n,t,w,v}));
  // المراكز تُحسب تلقائياً من عدد الأصوات (الأصوات المتساوية = نفس المركز)
  const distinct = [...new Set(MOVIES.map((m) => m.v))].sort((a,b) => b-a);
  MOVIES.forEach((m) => m.rank = distinct.indexOf(m.v) + 1);
  MOVIES.sort((a,b) => b.v - a.v || a.n - b.n);
  const max = MOVIES[0].v, medal = ["🥇","🥈","🥉"];
  const grid = $("#grid");
  grid.innerHTML = MOVIES.map((m) => `<div class="card is-movie reveal"><div class="card-media" data-wiki="${esc(m.w)}"><div class="card-flags"><span class="badge ${m.rank<=3?"badge-new":""}">${medal[m.rank-1]||""} المركز ${m.rank}</span></div><div class="card-num"><small>الفيلم</small>${m.n}</div></div>
    <div class="card-body"><div class="card-title">${esc(m.t)}</div><div style="height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden"><div style="height:100%;width:${Math.round(m.v/max*100)}%;background:linear-gradient(90deg,var(--brand),var(--accent))"></div></div><div class="card-meta"><span>${m.v} صوت</span><span>${Math.round(m.v/max*100)}%</span></div></div></div>`).join("");
  A.reveal(grid);
  document.querySelectorAll("[data-wiki]").forEach(async (el) => {
    try { const r = await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(el.dataset.wiki)); const d = await r.json(); const src = (d.thumbnail || d.originalimage || {}).source;
      if (src) { const img = new Image(); img.alt = ""; img.loading = "lazy"; img.referrerPolicy = "no-referrer"; img.onload = () => img.classList.add("is-loaded"); img.src = src; el.prepend(img); } } catch (e) {}
  });
})();
</script>
